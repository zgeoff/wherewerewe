# Runs the shared Bun checks on every push to main, with the script list that the
# BUN_CHECK_SCRIPTS repo variable sets for pull requests too, then releases wherewerewe through the
# shared release-please job, and ships each release as compiled binaries on its GitHub release and
# a formula in the Homebrew tap.
name: Main

on:
  push:
    branches: [main]
  # The ship run, which a push run dispatches at the release tag, and the way to ship a tagged
  # release again: run it at the tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Two runs of one commit, such as a rerun and a dispatch, wait for each other, and no run is
  # cancelled, so every merged commit is tested.
  checks:
    concurrency:
      group:
        main-checks-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.sha }}
      cancel-in-progress: false
    # GitHub checks the called workflow's job permissions even for its skipped gitleaks job, which
    # asks for pull-requests: write
    permissions:
      contents: read
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/bun-checks.yml@a8c62d5e90a66cbee12cf64573fd0169d44bbe2c # main
    with:
      scripts: ${{ vars.BUN_CHECK_SCRIPTS }}
      timeout-minutes: ${{ fromJSON(vars.BUN_CHECK_TIMEOUT_MINUTES || '20') }}
      # the pull request that landed the commits already scanned them
      gitleaks: false

  # A release takes two runs:
  # - Run 1, after a releasable commit lands on main: the shared release-please job opens or
  #   updates the release pull request. A person merges it, so merge stays off, and the run of that
  #   merge's push tags the release. The dispatch-ship job then starts run 2.
  # - Run 2, dispatched at the tag: the ship job attaches the binaries to the release and writes the
  #   formula, after the checks and the binaries of the tagged commit pass.
  # The release waits for its one-time setup, which the RELEASE_ENABLED repo variable marks done.
  # Its queue keeps every waiting run.
  release:
    if: github.event_name == 'push' && vars.RELEASE_ENABLED == 'true'
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/release-please.yml@a8c62d5e90a66cbee12cf64573fd0169d44bbe2c # main
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
      merge: false
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # The ship run checks out the tag, so it builds and ships exactly the tagged commit.
  dispatch-ship:
    name: Dispatch the release ship
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dispatch-ship
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Dispatch the ship at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTPUTS: ${{ needs.release.outputs.release-outputs }}
        run: bun run --silent ci:dispatch-ship

  # Only a dispatch at a release tag, with the release turned on, builds and ships; the scripts
  # check the tag again.
  # A newer dispatch at the same tag cancels this build, so this run's ship never starts; the newer
  # run builds and ships the tag.
  binaries:
    if:
      github.event_name == 'workflow_dispatch' && startsWith(github.ref,
      'refs/tags/@wherewerewe/cli@') && vars.RELEASE_ENABLED == 'true'
    concurrency:
      group: main-binaries-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/binaries.yml

  # A newer ship waits for this one to end, and queue: max keeps every waiting run. A ship is never
  # cancelled: one cut off halfway leaves a release with some of its assets.
  ship:
    name: Ship the release
    needs: [checks, binaries]
    if:
      github.event_name == 'workflow_dispatch' && startsWith(github.ref,
      'refs/tags/@wherewerewe/cli@') && vars.RELEASE_ENABLED == 'true'
    concurrency:
      group: ship
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --frozen-lockfile
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run --silent ci:release-upload

      # The tap is a second repository, so the release App has to be installed on it as well and
      # HOMEBREW_TAP set to its name (docs/runbooks/releasing.md). With either missing, the formula
      # is left alone.
      - name: Mint tap token
        id: tap-token
        if: vars.RELEASE_APP_ID != '' && vars.HOMEBREW_TAP != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.HOMEBREW_TAP }}
      - name: Update the Homebrew formula
        if: steps.tap-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP: ${{ github.repository_owner }}/${{ vars.HOMEBREW_TAP }}
        run: bun run --silent ci:formula-update
